  .scroll { animation: scroll 4s linear infinite; }
  .live { animation: blink 1.2s steps(2) infinite; }
  @keyframes jit { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg); } }
  @keyframes scroll { to { transform: translateX(-240px); } }
  @keyframes blink { 50% { opacity: 0.2; } }
  @media (prefers-reduced-motion: reduce) { .needle, .scroll, .live { animation: none; } }
</style>
