<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-label="Painel de brincadeira monitorando o Lukas: café 92%, foco em alta, bugs sob controle, sinal de vida ao vivo.">
