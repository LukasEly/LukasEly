<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-labelledby="t d">
<title id="t">Lukas Ely</title>
<desc id="d">Engenharia de Computação na PUCRS. Sistemas embarcados, hardware digital e IoT.</desc>
<defs>
  <linearGradient id="bgh" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111c33"/><stop offset="1" stop-color="#0b1220"/>
  </linearGradient>
  <pattern id="gridh" width="22" height="22" patternUnits="userSpaceOnUse">
    <path d="M22 0H0V22" fill="none" stroke="#1e2b47" stroke-width="0.6"/>
  </pattern>
</defs>
<style>
  .trace { stroke-dasharray: 2400; animation: draw 3.2s ease-out both; }
  .blink { animation: blink 1.6s steps(2) infinite; }
  @keyframes draw { from { stroke-dashoffset: 2400; } to { stroke-dashoffset: 0; } }
  @keyframes blink { 50% { opacity: 0.15; } }
  @media (prefers-reduced-motion: reduce) { .trace { animation: none; } .blink { animation: none; } }
</style>
<rect width="880" height="250" rx="16" fill="url(#bgh)"/>
<rect width="880" height="250" rx="16" fill="url(#gridh)" opacity="0.55"/>
<rect x="0.5" y="0.5" width="879" height="249" rx="15.5" fill="none" stroke="#1e2b47"/>

